<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="CMK75 Menu Editor banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1116"/><stop offset="1" stop-color="#16202B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2EA8FF"/><stop offset="1" stop-color="#7C4DFF"/>
    </linearGradient>
  </defs>
  <rect width="960" height="300" rx="24" fill="url(#bg)"/>
  <!-- keyboard -->
  <g transform="translate(60,70)">
    <rect width="330" height="160" rx="16" fill="#1C2733" stroke="#2B3A4A" stroke-width="2"/>
    <rect x="18" y="16" width="120" height="68" rx="6" fill="#0A0D12" stroke="url(#accent)" stroke-width="2"/>
    <rect x="30" y="28" width="70" height="8" rx="4" fill="#2EA8FF"/>
    <rect x="30" y="44" width="52" height="6" rx="3" fill="#4A5B6D"/>
    <rect x="30" y="58" width="62" height="6" rx="3" fill="#4A5B6D"/>
    <circle cx="190" cy="50" r="24" fill="#222F3D" stroke="url(#accent)" stroke-width="3"/>
    <line x1="190" y1="50" x2="190" y2="32" stroke="#2EA8FF" stroke-width="4" stroke-linecap="round"/>
    <g fill="#2B3A4A">
      <rect x="18" y="98" width="34" height="24" rx="5"/><rect x="58" y="98" width="34" height="24" rx="5"/>
      <rect x="98" y="98" width="34" height="24" rx="5"/><rect x="138" y="98" width="34" height="24" rx="5"/>
      <rect x="178" y="98" width="34" height="24" rx="5"/><rect x="218" y="98" width="34" height="24" rx="5"/>
      <rect x="258" y="98" width="54" height="24" rx="5"/>
      <rect x="18" y="128" width="60" height="20" rx="5"/><rect x="84" y="128" width="170" height="20" rx="5"/>
      <rect x="260" y="128" width="52" height="20" rx="5"/>
    </g>
  </g>
  <!-- text -->
  <text x="440" y="130" fill="#FFFFFF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700">CMK75</text>
  <text x="440" y="186" fill="url(#accent)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="600">Menu Editor</text>
  <text x="440" y="228" fill="#9FB0C3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" textLength="470" lengthAdjust="spacingAndGlyphs">Turn the screen and knob into a Stream Deck-style launcher</text>
</svg>
