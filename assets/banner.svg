  <text x="440" y="186" fill="#B5451B" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="600">Menu Editor</text>
  <text x="440" y="228" fill="#6A665D" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" textLength="470" lengthAdjust="spacingAndGlyphs">Turn the screen and knob into a Stream Deck-style launcher</text>
